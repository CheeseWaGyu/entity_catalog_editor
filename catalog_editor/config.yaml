name: "Entity Catalog Editor"
version: "0.1.0"
slug: "catalog_editor"
description: "HAのエンティティをチェックリストで選んで entity_catalog.yaml を更新する"
arch: [aarch64, amd64, armv7]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:format-list-checks"
panel_title: "Entity Catalog"
homeassistant_api: true
map:
  - all_addon_configs:rw
options:
  catalog_path: "/addon_configs/959b8912_muse_automation_mcp/entity_catalog.yaml"
schema:
  catalog_path: str

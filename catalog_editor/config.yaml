name: "Entity Catalog Editor"
version: "0.2.2"
slug: "catalog_editor"
description: "HAのエンティティをチェックリストで選んで entity_catalog.yaml を更新する"
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:format-list-checks"
panel_title: "Entity Catalog"
# カタログ（＝AIに見せる entity の許可リスト）を書き換える画面なので管理者だけに表示する
panel_admin: true
homeassistant_api: true
map:
  # entity_catalog.yaml は MCP アドオン側の設定ディレクトリにあるため、
  # 他アドオンの設定へ書くには all_addon_configs が必要（README 参照）
  - all_addon_configs:rw
options:
  catalog_path: "/addon_configs/959b8912_muse_automation_mcp/entity_catalog.yaml"
schema:
  catalog_path: str
